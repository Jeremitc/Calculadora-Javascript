<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora SENATI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="titulo-principal">Calculadora SENATI</h1>
    <div class="calculadora">
      <input type="text" id="entrada" disabled />
      <div class="botones">
        <button class="btn-action" onclick="clearEntry()">C</button>
        <button class="btn-action" onclick="deleteLast()">DEL</button>
        <button class="btn-op" onclick="addToInput('/')">/</button>
        <button class="btn-op" onclick="addToInput('*')">*</button>
        <button class="btn-num" onclick="addToInput('7')">7</button>
        <button class="btn-num" onclick="addToInput('8')">8</button>
        <button class="btn-num" onclick="addToInput('9')">9</button>
        <button class="btn-op" onclick="addToInput('-')">-</button>
        <button class="btn-num" onclick="addToInput('4')">4</button>
        <button class="btn-num" onclick="addToInput('5')">5</button>
        <button class="btn-num" onclick="addToInput('6')">6</button>
        <button class="btn-op" onclick="addToInput('+')">+</button>
        <button class="btn-num" onclick="addToInput('1')">1</button>
        <button class="btn-num" onclick="addToInput('2')">2</button>
        <button class="btn-num" onclick="addToInput('3')">3</button>
        <button class="btn-op" onclick="raizCuadrada()">√</button>
        <button class="btn-equal" onclick="calculateResult()">=</button>
        <button class="btn-num" onclick="addToInput('0')">0</button>
        <button class="btn-num" onclick="addToInput('.')">.</button>
      </div>
    </div>
    <div class="team-container">
      <h3>Equipo de Desarrollo</h3>
      <div class="team-list">
        <p>Jeremitc <span>Programador</span></p>
        <p>soulLeo77 <span>Programador</span></p>
        <p>CarlosDaniel-GCH <span>Programador</span></p>
        <p>JoseRosas20 <span>Programador</span></p>
        <p>Zenaida <span>Diseño (Canva)</span></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
